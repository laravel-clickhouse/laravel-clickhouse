name: tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    name: Code style

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Installing php
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install dependencies
        run: composer update --prefer-dist -n -o

      - name: Check code style
        run: vendor/bin/pint src tests --test

  laravel:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    strategy:
      fail-fast: false
      # Two one-dimensional sweeps instead of a full cross product: the
      # PHP x Laravel legs pin ClickHouse to the current LTS, and a single
      # pinned PHP + Laravel leg sweeps every supported ClickHouse major
      # (majors differ in observable ways — e.g. 23.x returns plain-text
      # error bodies where 24+ returns JSON — but that variance lives in
      # the transport, which PHP/Laravel versions do not affect).
      # 25-alpine/26-alpine bare-major tags do not exist on Docker Hub,
      # hence the explicit LTS minors.
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        laravel:
          - "^11.21"
          - "^12.0"
          - "^13.0"
        clickhouse:
          - "26.3-alpine"
        exclude:
          - php: "8.2"
            laravel: "^13.0"
        include:
          - { php: "8.4", laravel: "^13.0", clickhouse: "23.8-alpine" }
          - { php: "8.4", laravel: "^13.0", clickhouse: "24.8-alpine" }
          - { php: "8.4", laravel: "^13.0", clickhouse: "25.8-alpine" }

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ClickHouse ${{ matrix.clickhouse }}

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: default
        ports:
          - 8123:8123

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Installing php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: pcov

      # Laravel 11 reached end of life in March 2026, so its known advisories
      # (e.g. PKSA-mdq4-51ck-6kdq, fixed only in 12.60/13.10) will never get a
      # patch, and Composer >= 2.10 refuses to resolve the ^11.21 matrix leg
      # because every 11.x release is affected. Ignoring advisories for
      # laravel/framework on this leg only keeps the newer legs protected.
      - name: Allow known-unfixable advisories on EOL Laravel 11
        if: matrix.laravel == '^11.21'
        run: composer config policy.advisories.ignore --json '["laravel/framework"]'

      - name: Install dependencies
        run: |
          composer require "illuminate/database:${{ matrix.laravel }}" --dev --no-update
          composer update --prefer-dist -n -o

      - name: Execute tests
        run: |
          vendor/bin/phpstan analyse -c phpstan.core.neon
          vendor/bin/phpstan analyse -c phpstan.laravel.neon
          vendor/bin/phpunit --testsuite=Core-Unit,Core-Feature --coverage-text
          vendor/bin/phpunit --testsuite=Laravel-Unit --coverage-text
          vendor/bin/phpunit --testsuite=Laravel-Feature --coverage-text

  hypervel:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.4"
          - "8.5"
        swoole:
          - "6.2"
        hypervel:
          - "0.4.x-dev"
        # Same shape as the laravel job: PHP legs pin the current LTS, one
        # pinned PHP leg sweeps the remaining ClickHouse majors.
        clickhouse:
          - "26.3-alpine"
        include:
          - { php: "8.4", swoole: "6.2", hypervel: "0.4.x-dev", clickhouse: "23.8-alpine" }
          - { php: "8.4", swoole: "6.2", hypervel: "0.4.x-dev", clickhouse: "24.8-alpine" }
          - { php: "8.4", swoole: "6.2", hypervel: "0.4.x-dev", clickhouse: "25.8-alpine" }

    name: PHP ${{ matrix.php }} (swoole-${{ matrix.swoole }}) / Hypervel ${{ matrix.hypervel }} / ClickHouse ${{ matrix.clickhouse }}

    container:
      image: phpswoole/swoole:${{ matrix.swoole }}-php${{ matrix.php }}

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: default
        ports:
          - 8123:8123

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The phpswoole image ships swoole, redis, sockets and pdo_mysql but
      # not intl, which hypervel/components declares as a platform
      # requirement (hypervel's own CI installs it the same way). Swoole
      # short names must be off — Hypervel's Application refuses to boot
      # with them enabled (they shadow its coroutine helpers).
      - name: Install PHP extensions
        run: |
          apt-get update -qq
          apt-get install -y -qq libicu-dev > /dev/null
          docker-php-ext-install -j"$(nproc)" intl pcntl > /dev/null
          echo "swoole.use_shortname=Off" > /usr/local/etc/php/conf.d/99-swoole-shortname.ini

      # symfony/yaml and fakerphp/faker are soft dependencies of Hypervel's
      # testbench (config loading and the WithFaker trait) that
      # hypervel/components does not require itself. PHPUnit must be 13+:
      # RunTestsInCoroutine overrides invokeTestMethod(), which only exists
      # since PHPUnit 13 — on 11 the per-test coroutine wrapper silently
      # never runs and RefreshDatabase transactions are skipped.
      - name: Install dependencies
        run: |
          composer config minimum-stability dev
          composer remove illuminate/database orchestra/testbench --dev --no-update
          composer require "hypervel/components:${{ matrix.hypervel }}" "symfony/yaml:^8.1" "fakerphp/faker:^1.23" "phpunit/phpunit:^13.0.3" --dev --no-update
          COMPOSER_MEMORY_LIMIT=-1 composer update --prefer-dist -n -o

      - name: Execute tests
        env:
          CLICKHOUSE_HOST: clickhouse
        run: |
          vendor/bin/phpstan analyse -c phpstan.core.neon --memory-limit=-1
          vendor/bin/phpstan analyse -c phpstan.hypervel.neon --memory-limit=-1
          vendor/bin/phpunit --testsuite=Core-Unit,Core-Feature
          vendor/bin/phpunit --testsuite=Hypervel-Unit
          vendor/bin/phpunit --testsuite=Hypervel-Feature
