name: tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        laravel:
          - "^11.21"
          - "^12.0"
          - "^13.0"
        # The last LTS of every supported major. Majors differ in
        # observable ways (e.g. 23.x returns plain-text error bodies where
        # 24+ returns JSON), so transport parsing must be exercised against
        # each family. 25-alpine/26-alpine bare-major tags do not exist on
        # Docker Hub, hence the explicit LTS minors.
        clickhouse:
          - "23.8-alpine"
          - "24.8-alpine"
          - "25.8-alpine"
          - "26.3-alpine"
        exclude:
          - php: "8.2"
            laravel: "^13.0"

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ClickHouse ${{ matrix.clickhouse }}

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: default
        ports:
          - 8123:8123

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Installing php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: pcov

      # Laravel 11 reached end of life in March 2026, so its known advisories
      # (e.g. PKSA-mdq4-51ck-6kdq, fixed only in 12.60/13.10) will never get a
      # patch, and Composer >= 2.10 refuses to resolve the ^11.21 matrix leg
      # because every 11.x release is affected. Ignoring advisories for
      # laravel/framework on this leg only keeps the newer legs protected.
      - name: Allow known-unfixable advisories on EOL Laravel 11
        if: matrix.laravel == '^11.21'
        run: composer config policy.advisories.ignore --json '["laravel/framework"]'

      - name: Install dependencies
        run: |
          composer require "illuminate/database:${{ matrix.laravel }}" --dev --no-update
          composer update --prefer-dist -n -o

      - name: Execute tests
        run: |
          vendor/bin/pint src tests --test
          vendor/bin/phpstan analyse
          vendor/bin/phpunit --testsuite=Unit --coverage-text
          vendor/bin/phpunit --testsuite=Feature --coverage-text
